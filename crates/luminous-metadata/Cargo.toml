[package]
name = "luminous-metadata"
version = "0.1.0"
description = "Audio file tag reading/writing, sidecar metadata (CUE, DR Meter), and playlist format parsers"
edition = "2021"
publish = false
license.workspace = true

# Must never depend on tauri, rusqlite, reqwest or tokio: CI checks
# `cargo tree -p luminous-metadata -e normal` for them (#1766, epic #1762).
[dependencies]
lofty = "0.25"
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
percent-encoding = "2"
log.workspace = true

[dev-dependencies]
tempfile = "3"
