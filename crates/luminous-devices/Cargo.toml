[package]
name = "luminous-devices"
version = "0.1.0"
description = "Removable volume detection, portable device profiles and safe eject for portable music players"
edition = "2021"
publish = false
license.workspace = true

# Must never depend on tauri or rusqlite: CI checks
# `cargo tree -p luminous-devices -e normal` for them (#835, epic #834).
[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
parking_lot.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_Devices_DeviceAndDriverInstallation",
    # MTP players through Windows Portable Devices (#840)
    "Win32_Devices_PortableDevices",
    "Win32_Devices_Properties",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# udisks2 over D-Bus: the same pure-Rust client and runtime src-tauri's MPRIS
# integration uses, through its blocking API (zbus runs its own Tokio runtime).
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
# MTP through gvfs (#1845): the GIO already in the tree through Tauri's GTK
# stack, so the Flatpak builds no new C library.
gio = "0.18"

[dev-dependencies]
tempfile = "3"
