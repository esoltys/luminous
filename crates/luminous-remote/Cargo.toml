[package]
name = "luminous-remote"
version = "0.1.0"
description = "Remote wire-protocol clients (Subsonic, WebDAV, ListenBrainz, CritiqueBrainz, Lyrics, MusicBrainz)"
edition = "2021"
publish = false
license.workspace = true

# Must never depend on tauri or rusqlite: CI checks
# `cargo tree -p luminous-remote -e normal` for them (#1767, epic #1762).
[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "form", "rustls", "blocking"] }
quick-xml = { version = "0.42", features = ["serialize"] }
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
md-5 = "0.11"
sha2 = "0.11"
rand = "0.10"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["time"] }
anyhow.workspace = true
log.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
