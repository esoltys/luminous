id: org.luminous.music
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20

command: LuminousMusicPlayer

# No network access during the actual build — all Cargo/bun dependencies must be
# resolved ahead of time via flatpak/generate-sources.sh into
# flatpak/cargo-sources.json and flatpak/node-sources.json (see docs/FLATPAK.md).
finish-args:
  # Display + input
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Audio playback (CPAL -> PulseAudio/PipeWire)
  - --socket=pulseaudio
  # Lyrics (LRCLIB, Lyrics.ovh), cover art (iTunes) and MusicBrainz lookups
  - --share=network
  # Library folders are chosen via the portal file/folder picker (Tauri dialog
  # plugin), which grants persistent per-folder access without a broad
  # --filesystem=home escape hatch.
  - --filesystem=xdg-music
  - --talk-name=org.freedesktop.portal.FileChooser
  - --talk-name=org.freedesktop.portal.Notification

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin
  env:
    CARGO_HOME: /run/build/luminous/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: luminous
    buildsystem: simple
    build-commands:
      - bun install --frozen-lockfile --offline
      - bun run tauri build --bundles none -- --offline
      - install -Dm755 src-tauri/target/release/LuminousMusicPlayer
        /app/bin/LuminousMusicPlayer
      - install -Dm644 flatpak/org.luminous.music.desktop
        /app/share/applications/org.luminous.music.desktop
      - install -Dm644 src-tauri/metainfo/org.luminous.music.metainfo.xml
        /app/share/metainfo/org.luminous.music.metainfo.xml
      - cp -r src-tauri/icons/hicolor /app/share/icons/hicolor
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - target
          - build
          - node_modules
      # Generated by flatpak/generate-sources.sh — regenerate whenever
      # Cargo.lock or bun.lock change.
      - flatpak/cargo-sources.json
      - flatpak/node-sources.json
