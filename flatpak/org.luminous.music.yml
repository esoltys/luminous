id: org.luminous.music
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22

command: LuminousMusicPlayer

finish-args:
  # Display + input
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Audio playback (CPAL -> PulseAudio/PipeWire)
  - --socket=pulseaudio
  # Direct Hardware (ALSA) output opens the card's /dev/snd PCM itself (#1727);
  # there is no narrower device permission that exposes /dev/snd.
  - --device=all
  # Lyrics (LRCLIB, Lyrics.ovh), cover art (iTunes) and MusicBrainz lookups
  - --share=network
  # Library folders are chosen via the portal file/folder picker (Tauri dialog
  # plugin), which grants persistent per-folder access without a broad
  # --filesystem=home escape hatch.
  - --filesystem=xdg-music
  - --talk-name=org.freedesktop.portal.FileChooser
  # Portable players and USB drives (#835): see them where udisks2 mounts
  # them, and unmount/power them off through udisks2 for Eject.
  - --filesystem=/run/media
  - --filesystem=/media
  - --system-talk-name=org.freedesktop.UDisks2
  - --talk-name=org.freedesktop.portal.Notification
  # MPRIS2 media-key/session integration (src-tauri/src/media_session/linux.rs)
  # registers its own well-known name on the session bus.
  - --socket=session-bus
  - --own-name=org.mpris.MediaPlayer2.luminous
  # Direct Hardware (ALSA) output reserves its card through the device
  # reservation protocol so PipeWire releases it (#1844).
  - --own-name=org.freedesktop.ReserveDevice1.*

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin:/var/tmp/bun/bin

modules:
  # System tray icon (tray-icon crate) dlopens libayatana-appindicator3 or
  # libappindicator3 at runtime, neither of which the GNOME runtime ships.
  # This builds the latter (same soname the crate falls back to) from
  # upstream Flathub's shared-modules definitions.
  - shared-modules/libappindicator/libappindicator-gtk3-12.10.json
  - name: luminous
    buildsystem: simple
    # This repo is self-hosted (not submitted to Flathub, which is the party that
    # actually enforces network-isolated builds), so the build module is granted
    # network access directly rather than vendoring offline Cargo/bun sources —
    # `bun.lock` in particular isn't supported by any of the standard offline-source
    # generators (npm/yarn/pnpm only). Revisit if this ever needs to go to Flathub.
    build-options:
      build-args:
        - --share=network
    build-commands:
      # The node22 SDK extension provides Node.js/npm, not Bun — install it
      # directly since this repo uses bun.lock (see the network-access note above).
      - curl -fsSL https://bun.sh/install | BUN_INSTALL=/var/tmp/bun bash
      - bun install --frozen-lockfile
      - bun run tauri build --no-bundle
      # This repo is a Cargo workspace (src-tauri is a member), so cargo/tauri
      # write build output to the workspace-root target/, not src-tauri/target/
      # (see docs/TROUBLESHOOTING.md).
      - install -Dm755 target/release/LuminousMusicPlayer
        /app/bin/LuminousMusicPlayer
      - install -Dm644 flatpak/org.luminous.music.desktop
        /app/share/applications/org.luminous.music.desktop
      - install -Dm644 src-tauri/metainfo/org.luminous.music.metainfo.xml
        /app/share/metainfo/org.luminous.music.metainfo.xml
      - mkdir -p /app/share/icons
      - cp -r src-tauri/icons/hicolor /app/share/icons/hicolor
      # Install app icons under both the component id (required by AppStream)
      # and mainBinaryName (standard desktop environment fallback).
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/org.luminous.music.png
      - install -Dm644 src-tauri/icons/64x64.png /app/share/icons/hicolor/64x64/apps/org.luminous.music.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/org.luminous.music.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/org.luminous.music.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/org.luminous.music.png
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/LuminousMusicPlayer.png
      - install -Dm644 src-tauri/icons/64x64.png /app/share/icons/hicolor/64x64/apps/LuminousMusicPlayer.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/LuminousMusicPlayer.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/LuminousMusicPlayer.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/LuminousMusicPlayer.png
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - target
          - build
          - node_modules
