[package]
name = "luminous"
version = "0.99.2"
description = "A high-performance home for the music you already own"
authors = ["Eric James Soltys <ericjamessoltys@outlook.com>"]
edition = "2021"

[lib]
name = "luminous_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "LuminousMusicPlayer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri ---
# "unstable" gates `Manager::get_window`, needed to reach the lower-level
# `Window::start_resize_dragging` from a `WebviewWindow` command handler.
tauri = { version = "2", features = ["unstable"] }
tauri-runtime = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Cross-restart window geometry persistence (Windows/macOS/X11-Linux — see
# geometry_capture_supported() in commands/window.rs for why this can't help
# on Wayland).
tauri-plugin-window-state = "2"
tauri-plugin-positioner = "2"
# Suppress stock webview browser chrome (reload, find, print, zoom, native
# context menu, devtools in release builds) so the app reads as native
# rather than a browser tab (#212). `platform-windows` unlocks WebView2-only
# settings (accelerator keys, pinch/ctrl-wheel zoom) not covered by the
# cross-platform JS-injection flags, so it's only pulled in on Windows.
tauri-plugin-prevent-default = "5"


# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Async runtime ---
tokio = { version = "1", features = ["full"] }

# --- Database ---
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# --- Audio decoding ---
# `all` enables every codec and format symphonia supports.
# Note: AIFF is not yet a supported format in symphonia 0.5.x.
symphonia = { version = "0.6", features = ["all"] }

# --- Audio output ---
cpal = "0.18"
ringbuf = "0.5"


# --- Audio resampling ---
rubato = "4.0"

# --- Tag reading/writing ---
lofty = "0.21"

# --- FFT (spectrum analyzer, band waveform) ---
rustfft = "6"

# --- EBU R128 / BS.1770 loudness measurement (#77) ---
bs1770 = "1"

# --- File watching ---
notify = { version = "8", features = ["serde"] }

# --- OS "Now Playing" integration: SMTC (Windows), MPRIS2 (Linux), ---
# --- MPNowPlayingInfoCenter (macOS) (#80) ---
# `use_zbus` gives a pure-Rust D-Bus client on Linux, avoiding a build-time
# dependency on libdbus-1-dev (the default `use_dbus` feature links libdbus).
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

# --- HTTP client ---
# Use rustls to avoid requiring libssl-dev system package
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "form", "rustls"] }

# --- UUID for playlist item identity ---
uuid = { version = "1", features = ["v4"] }

# --- Error handling ---
thiserror = "2"
anyhow = "1"

# --- Logging ---
log = "0.4"

# --- Utilities ---
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
rand = "0.8"
percent-encoding = "2"

# --- Data-parallel tag reading during library scan ---
rayon = "1"

# WebView2-only settings for tauri-plugin-prevent-default (zoom control,
# browser accelerator keys) — the feature links webview2-com/windows, so it's
# gated to the Windows target only.
[target.'cfg(windows)'.dependencies]
tauri-plugin-prevent-default = { version = "5", features = ["platform-windows"] }

[dev-dependencies]
cucumber = { version = "0.23", features = ["macros"] }
tempfile = "3"

[[test]]
name = "equalizer_bdd"
harness = false

[[test]]
name = "library_scan_bdd"
harness = false

[[test]]
name = "playlists_bdd"
harness = false

[[test]]
name = "lyrics_bdd"
harness = false

[[test]]
name = "cover_art_bdd"
harness = false

[[test]]
name = "tag_editor_bdd"
harness = false
