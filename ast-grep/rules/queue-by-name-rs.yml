id: queue-by-name-rs
language: Rust
severity: error
message: Don't identify the Queue by its name.
note: |
  AGENTS.md "Queue abstraction": branch on `Playlist.is_queue`
  (`PlaylistManager::queue()`), never the name.
rule:
  any:
    - pattern: $P.name == $S
    - pattern: $P.name != $S
    - pattern: $S == $P.name
    - pattern: $S != $P.name
constraints:
  S:
    regex: ^"(?i:queue)"$
