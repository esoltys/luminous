id: audio-no-std-mutex
language: Rust
severity: error
message: Use parking_lot::Mutex in audio code, not std::sync::Mutex.
note: |
  AGENTS.md "Allocation-free audio thread": parking_lot's Mutex can't be
  poisoned, so a panic elsewhere can't take down the playback path.
files:
  - src-tauri/src/audio.rs
  - src-tauri/src/player.rs
  - src-tauri/src/player/**
  - src-tauri/src/equalizer.rs
rule:
  any:
    - kind: scoped_identifier
      regex: ^std::sync::Mutex$
    - kind: scoped_type_identifier
      regex: ^std::sync::Mutex$
    - kind: identifier
      regex: ^Mutex$
      inside:
        kind: use_declaration
        regex: '^use\s+std::sync::'
        stopBy: end
