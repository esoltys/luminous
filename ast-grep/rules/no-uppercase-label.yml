id: no-uppercase-label
language: html
severity: error
message: Labels and headings are sentence case. Don't use `uppercase` or wide letter-spacing.
note: |
  Issue #2050 / docs/UI_CONVENTIONS.md "Sentence-case labels": express hierarchy
  with the `label-field` / `label-heading` / `label-small` utilities (size and
  weight) plus the secondary text colour. If the text is a code or abbreviation
  that is not a label (hex value, language code, file type), use `code-caps`.
rule:
  any:
    - kind: attribute_value
      regex: '(^|[\s"''`])(uppercase|tracking-(wide|wider|widest))($|[\s"''`])'
    - kind: raw_text
      regex: '"[^"]*\b(uppercase|tracking-(wide|wider|widest))\b[^"]*"'
