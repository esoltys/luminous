name: "CodeQL Advanced"

on:
  push:
    branches: [ "main", "next" ]
  pull_request:
    branches: [ "main", "next" ]
  schedule:
    - cron: '43 21 * * 6'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: javascript-typescript
          build-mode: none
        - language: rust
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Install system dependencies (Linux)
      if: matrix.language == 'rust' && runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libssl-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

    # Caches the registry, git deps, and target dir across PR builds so
    # `cargo check` below doesn't recompile the whole dependency graph
    # (Symphonia, rusqlite, Tauri, etc.) from scratch on every run.
    - name: Cache Rust dependencies
      if: matrix.language == 'rust'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: Pre-build Rust dependencies & generated code
      if: matrix.language == 'rust'
      run: |
        cargo check

    - name: Initialize CodeQL
      uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      with:
        category: "/language:${{matrix.language}}"
