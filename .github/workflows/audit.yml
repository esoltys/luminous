name: Security Audit

on:
  push:
    branches: [ "main", "next" ]
  pull_request:
    branches: [ "main", "next" ]
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  security_audit:
    name: Cargo Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Security audit Cargo.lock
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # These are informational "unmaintained"/"unsound" advisories, not
          # vulnerabilities, all coming from transitive deps we don't control
          # directly: Tauri's Linux webview stack (webkit2gtk/tray-icon still
          # pull the archived gtk-rs 0.18 GTK3 bindings) and souvlaki's MPRIS
          # backend (zbus 3.x, itself pulling `derivative`/`instant`).
          # Re-check and prune this list whenever those upstreams move off
          # the flagged crates.
          ignore: >-
            RUSTSEC-2024-0413,
            RUSTSEC-2024-0416,
            RUSTSEC-2024-0388,
            RUSTSEC-2024-0412,
            RUSTSEC-2024-0418,
            RUSTSEC-2024-0411,
            RUSTSEC-2024-0417,
            RUSTSEC-2024-0414,
            RUSTSEC-2024-0415,
            RUSTSEC-2024-0420,
            RUSTSEC-2024-0419,
            RUSTSEC-2024-0384,
            RUSTSEC-2024-0436,
            RUSTSEC-2024-0370,
            RUSTSEC-2025-0081,
            RUSTSEC-2025-0075,
            RUSTSEC-2025-0080,
            RUSTSEC-2025-0100,
            RUSTSEC-2025-0098,
            RUSTSEC-2024-0429

  lockfile_check:
    name: bun.lock Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Fails if package.json's dependency ranges have moved without bun.lock
      # being regenerated to match — catches the drift `bun run release`
      # normally prevents (it runs `bun install` during the version bump).
      - name: Verify bun.lock is in sync with package.json
        run: bun install --frozen-lockfile

  winget_manifest_check:
    name: winget Manifest Drift Check
    # winget.exe (used to validate the manifest folder) is Windows-only.
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Regenerates the manifest for the latest committed version from the
      # matching GitHub release and diffs it against what's checked in —
      # catches drift from a release whose winget sync step (release.ts) was
      # skipped or failed, without depending on someone noticing by hand.
      - name: Check winget manifest matches latest release
        run: bun run scripts/submit-winget.ts --check

      # winget validate needs the multi-file manifest pointed at its version
      # folder, not an individual file — see #477. --ignore-warnings because
      # winget validate exits non-zero on ANY warning by default, including a
      # "schema header URL does not match expected pattern" warning that
      # depends on the runner's own winget build having our exact schema $id
      # baked in — a real mismatch/error still fails without --ignore-warnings.
      - name: Validate winget manifest with winget CLI
        shell: bash
        run: |
          winget --version
          latest=$(ls -1 winget/manifests/e/EricSoltys/LuminousMusicPlayer | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          winget validate --manifest "winget/manifests/e/EricSoltys/LuminousMusicPlayer/$latest" --ignore-warnings
