name: Security Audit

on:
  push:
    branches: [ "main", "next" ]
  pull_request:
    branches: [ "main", "next" ]
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight

permissions:
  contents: read
  checks: write

jobs:
  security_audit:
    name: Cargo Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Security audit Cargo.lock
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # These are informational "unmaintained"/"unsound" advisories, not
          # vulnerabilities, all coming from transitive deps we don't control
          # directly: Tauri's Linux webview stack (webkit2gtk/tray-icon still
          # pull the archived gtk-rs 0.18 GTK3 bindings) and souvlaki's MPRIS
          # backend (zbus 3.x, itself pulling `derivative`/`instant`).
          # Re-check and prune this list whenever those upstreams move off
          # the flagged crates.
          ignore: >-
            RUSTSEC-2024-0413,
            RUSTSEC-2024-0416,
            RUSTSEC-2024-0388,
            RUSTSEC-2024-0412,
            RUSTSEC-2024-0418,
            RUSTSEC-2024-0411,
            RUSTSEC-2024-0417,
            RUSTSEC-2024-0414,
            RUSTSEC-2024-0415,
            RUSTSEC-2024-0420,
            RUSTSEC-2024-0419,
            RUSTSEC-2024-0384,
            RUSTSEC-2024-0436,
            RUSTSEC-2024-0370,
            RUSTSEC-2025-0081,
            RUSTSEC-2025-0075,
            RUSTSEC-2025-0080,
            RUSTSEC-2025-0100,
            RUSTSEC-2025-0098,
            RUSTSEC-2024-0429
