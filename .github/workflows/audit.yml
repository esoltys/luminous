name: Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  security_audit:
    name: Cargo Security & Licence Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cargo Deny Check (Security, Licences, Sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  lockfile_check:
    name: Lockfile Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Fails if package.json's dependency ranges have moved without bun.lock
      # being regenerated to match — catches the drift `bun run release`
      # normally prevents (it runs `bun install` during the version bump).
      - name: Verify bun.lock is in sync with package.json
        run: bun install --frozen-lockfile

      # Fails if @tauri-apps/* npm packages and matching Rust crates in
      # Cargo.lock have drifted in major/minor version (#1208).
      - name: Check Tauri npm/crate version pairing
        run: bun run scripts/check-tauri-versions.ts

