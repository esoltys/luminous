name: "Release Build"

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Serialized (not parallel): tauri-action creates the draft release if
      # it doesn't exist yet, and both platforms running at once raced to
      # create two separate drafts with split assets and incompatible
      # updater manifests (v0.99.2). Running one platform at a time means
      # the second always finds and reuses the first's draft.
      max-parallel: 1
      matrix:
        platform: [ubuntu-24.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev libssl-dev pkg-config libayatana-appindicator3-dev librsvg2-dev

      - name: Determine Release Tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: 'Luminous ${{ steps.tag.outputs.tag }}'
          releaseBody: 'Release of Luminous ${{ steps.tag.outputs.tag }}.'
          releaseDraft: true
          prerelease: false

  winget:
    name: Publish to Winget
    if: (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Extract release version
        id: get_version
        shell: bash
        run: |
          VERSION="${TAG_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
        env:
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Install wingetcreate
        run: winget install Microsoft.WingetCreate --disable-interactivity --accept-source-agreements

      - name: Submit package update using wingetcreate
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          $url = "https://github.com/esoltys/luminous/releases/download/v$ver/Luminous_${ver}_x64-setup.exe"
          wingetcreate update EricSoltys.Luminous --version $ver --urls $url --token ${{ secrets.WINGET_PAT }}

  deploy-hosted-binary:
    name: Deploy Hosted Binary for Store & Cleanup Old Versions
    if: (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Extract release version
        id: get_version
        run: |
          VERSION="${TAG_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
        env:
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: esoltys/esoltys.github.io
          token: ${{ secrets.WINGET_PAT }}
          path: website

      - name: Update binary and clean up old versions
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          DOWNLOAD_DIR="website/luminous/downloads"
          
          # Clean up previous version directories
          rm -rf "$DOWNLOAD_DIR"/*
          mkdir -p "$DOWNLOAD_DIR/v$VERSION"
          
          # Download installer from release asset
          curl -sL -o "$DOWNLOAD_DIR/v$VERSION/Luminous_${VERSION}_x64-setup.exe" "https://github.com/esoltys/luminous/releases/download/v${VERSION}/Luminous_${VERSION}_x64-setup.exe"
          
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add luminous/downloads
          git commit -m "chore: publish Luminous v${VERSION} setup binary for Microsoft Store" || echo "No changes"
          git push origin main

  microsoft-store:
    name: Publish to Microsoft Store
    needs: deploy-hosted-binary
    if: (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Extract release version
        id: get_version
        run: |
          VERSION="${TAG_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
        env:
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Submit to Microsoft Store
        if: ${{ secrets.STORE_APP_ID != '' }}
        uses: microsoft/store-submission@v1
        with:
          tenant-id: ${{ secrets.STORE_TENANT_ID }}
          client-id: ${{ secrets.STORE_CLIENT_ID }}
          client-secret: ${{ secrets.STORE_CLIENT_SECRET }}
          app-id: ${{ secrets.STORE_APP_ID }}
          package-path: "https://esoltys.dev/luminous/downloads/v${{ steps.get_version.outputs.version }}/Luminous_${{ steps.get_version.outputs.version }}_x64-setup.exe"




