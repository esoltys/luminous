name: "Release Build"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Determine Release Tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      # Create the draft release once, up front, so both matrix legs below
      # can run in parallel and upload into the same release instead of each
      # racing to create their own draft (split assets, incompatible updater
      # manifests — this bit us in v0.99.2).
      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if ID=$(gh release view "$TAG" --json id -q .id 2>/dev/null); then
            echo "Found existing release $ID for $TAG"
          else
            gh release create "$TAG" --draft --title "Luminous $TAG" --notes "Release of Luminous $TAG."
            ID=$(gh release view "$TAG" --json id -q .id)
          fi
          echo "id=${ID}" >> "$GITHUB_OUTPUT"

  release:
    needs: create-release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      # Pinned so the tauri-cli cache key (below) stays stable across runs -
      # bump this deliberately when we want a newer tauri-cli.
      TAURI_CLI_VERSION: "2.11.4"
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Caches ~/.cargo/registry, ~/.cargo/git and the workspace target/ dir
      # (keyed on Cargo.lock + rustc version), so the Windows leg's two full
      # release compiles (NSIS build, then MSIX build) don't each start from
      # scratch on every run.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev libssl-dev pkg-config libayatana-appindicator3-dev librsvg2-dev

      - name: Cache Tauri bundler tools (NSIS/WiX)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/AppData/Local/tauri/NSIS
            ~/AppData/Local/tauri/WixTools*
          key: tauri-bundler-tools-windows

      # tauri-apps/binary-releases (source of the NSIS toolchain) occasionally
      # returns transient 503s, which fails the whole matrix leg. Retry a
      # couple of times before giving up.
      - name: Build and Release
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          action: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
          attempt_limit: 3
          attempt_delay: 15000
          with: |
            releaseId: ${{ needs.create-release.outputs.release_id }}
            tagName: ${{ needs.create-release.outputs.tag }}
            releaseDraft: true
            prerelease: false

      # cargo tracks installed-binary versions in .crates.toml/.crates2.json,
      # so caching those alongside the binary lets `cargo install` below
      # no-op on a cache hit instead of recompiling tauri-cli (and its
      # dependency tree - clap, tauri-bundler, resvg, usvg, jsonschema, etc.)
      # from source on every run.
      - name: Cache tauri-cli binary (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri.exe
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: tauri-cli-windows-${{ env.TAURI_CLI_VERSION }}

      - name: Install tauri-cli (Windows)
        if: matrix.platform == 'windows-latest'
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}"

      - name: Build MSIX Package (Windows)
        if: matrix.platform == 'windows-latest'
        # src-tauri is a workspace member (see root Cargo.toml), so Cargo's
        # shared target dir lives at the workspace root, not src-tauri/target.
        # tauri-windows-bundle assumes the latter unless told otherwise.
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: bun run tauri:windows:build

      - name: Upload MSIX to Release Assets
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          # softprops/action-gh-release publishes the release if `draft` is
          # omitted - it doesn't preserve the existing draft state.
          draft: true
          files: |
            target/msix/*.msix
            target/msix/*.msixbundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

