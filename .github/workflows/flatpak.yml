name: Flatpak

on:
  push:
    branches: [ "main", "next" ]
    paths:
      - "flatpak/**"
      - "src-tauri/icons/org.luminous.music.metainfo.xml"
      - ".github/workflows/flatpak.yml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches: [ "main", "next" ]
    paths:
      - "flatpak/**"
      - "src-tauri/icons/org.luminous.music.metainfo.xml"
      - ".github/workflows/flatpak.yml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

jobs:
  lint:
    name: flatpak-builder-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lint manifest
        run: |
          docker run --rm -v "$PWD":/mnt ghcr.io/flathub/flatpak-builder-lint:latest \
            manifest --gha-format /mnt/flatpak/io.github.esoltys.Luminous.yml

      - name: Lint AppStream metainfo
        run: |
          docker run --rm -v "$PWD":/mnt ghcr.io/flathub/flatpak-builder-lint:latest \
            appstream --gha-format /mnt/src-tauri/icons/org.luminous.music.metainfo.xml

  build:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: luminous.flatpak
          manifest-path: flatpak/io.github.esoltys.Luminous.yml
          # Keyed on the manifest and dependency-source files (not github.sha) so
          # unrelated commits reuse the cache; only manifest/dependency changes
          # invalidate it. See #520 (analogous to #390's rust-cache fix).
          cache-key: flatpak-builder-${{ hashFiles('flatpak/io.github.esoltys.Luminous.yml', 'flatpak/cargo-sources.json', 'flatpak/node-sources.json') }}
          build-bundle: true
          run-tests: false
          upload-artifact: true
