name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend_check:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Check if frontend checks should run
        id: scope
        run: bash scripts/ci-should-run.sh frontend

      - name: Setup Bun
        if: steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Run svelte-check
        if: steps.scope.outputs.run == 'true'
        run: bun run check

      - name: Check architecture invariants (ast-grep)
        if: steps.scope.outputs.run == 'true'
        run: bun run lint:ast

  frontend_test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Check if frontend tests should run
        id: scope
        run: bash scripts/ci-should-run.sh frontend

      - name: Setup Bun
        if: steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Run Vitest
        if: steps.scope.outputs.run == 'true'
        run: bun run test:run

      - name: Run script tests
        if: steps.scope.outputs.run == 'true'
        run: bun test scripts/throwaway-profile.test.ts scripts/devtools-driver.test.ts

  backend_test:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Check if backend tests should run
        id: scope
        run: bash scripts/ci-should-run.sh backend

      - name: Install system dependencies (Linux)
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld libasound2-dev libssl-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      # Caches the registry, git deps, and target dir (including workspace
      # crates) across PR builds so `cargo test` below doesn't recompile the
      # dependency graph or unchanged engine crates from scratch on every run.
      - name: Cache Rust dependencies
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: true

      # Engine crates under `crates/` must never reach app layers (#1556,
      # epic #1762): check all five boundaries in a single step.
      - name: Check engine crate dependency boundaries
        if: steps.scope.outputs.run == 'true'
        run: |
          check_boundary() {
            local crate="$1"
            local pattern="$2"
            local tree
            tree=$(cargo tree -p "$crate" -e normal --prefix none)
            local forbidden
            forbidden=$(grep -E "$pattern" <<< "$tree" | sort -u || true)
            if [ -n "$forbidden" ]; then
              echo "::error::${crate} must not depend on: $forbidden"
              exit 1
            fi
          }
          check_boundary luminous-audio    '^(tauri|rusqlite|reqwest|tokio)[ -]'
          check_boundary luminous-addons   '^(tauri|rusqlite)[ -]'
          check_boundary luminous-analysis '^(tauri|rusqlite|reqwest|tokio)[ -]'
          check_boundary luminous-metadata '^(tauri|rusqlite|reqwest|tokio)[ -]'
          check_boundary luminous-remote   '^(tauri|rusqlite)[ -]'

      # From the repo root with --workspace --lib --tests, so every crate under
      # crates/ and src-tauri is unit- and integration-tested (#1554) without
      # linking the 0-test LuminousMusicPlayer binary or running 7 empty
      # rustdoc passes.
      - name: Run cargo test
        if: steps.scope.outputs.run == 'true'
        run: cargo test --workspace --lib --tests

      - name: Run clippy
        if: steps.scope.outputs.run == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The pre-commit hook (`bun run install:git-hooks`) is opt-in per clone, so
  # this is the only guard against formatting drift reaching main (#1234).
  # Needs no build or system deps, so it fails in seconds.
  rust_fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Check if Rust formatting check should run
        id: scope
        run: bash scripts/ci-should-run.sh backend

      - name: Check formatting
        if: steps.scope.outputs.run == 'true'
        run: cargo fmt --all --check

  # Machine-checked Lean models of the player/playlist state machines
  # (verification/lean/, epic #1224). `--wfail` turns warnings into failures,
  # so an unfinished proof (`sorry`, reported only as a warning) fails the job.
  lean_proofs:
    name: Lean Proofs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verification/lean
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Check if Lean proofs should run
        id: scope
        working-directory: .
        run: bash scripts/ci-should-run.sh lean

      - name: Cache Lean toolchain and build
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.elan
            verification/lean/.lake
          key: lean-${{ hashFiles('verification/lean/lean-toolchain') }}-${{ hashFiles('verification/lean/**/*.lean', 'verification/lean/lakefile.toml') }}
          restore-keys: lean-${{ hashFiles('verification/lean/lean-toolchain') }}-

      # The toolchain itself comes from verification/lean/lean-toolchain.
      - name: Install elan
        if: steps.scope.outputs.run == 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build and check proofs
        if: steps.scope.outputs.run == 'true'
        run: lake build --wfail

  # Extra gate for Dependabot PRs specifically, on top of the frontend_test/
  # backend_test jobs every PR already gets. Every historical dependency-
  # upgrade regression we've hit (lofty 0.21->0.25 silently dropping album
  # year, #433; a Tailwind/Lightning CSS version change altering minification
  # output, #370/0ad3c8a) reproduced only in conditions frontend_test/
  # backend_test don't cover on their own:
  #   - a REAL production build, not the jsdom/dev-mode Vitest environment
  #     (catches minification-only regressions like #370)
  #   - Cargo.lock actually matching Cargo.toml post-bump (--locked catches a
  #     bump that left the lockfile inconsistent)
  # (clippy is covered by every PR via the backend_test job above, so it's
  # not duplicated here.)
  # This is intentionally a separate, distinctly-named job (rather than
  # folded into frontend_test/backend_test) so it can be set as its own
  # required status check for a future Dependabot auto-merge policy, without
  # gating every human-authored PR on a full production build.
  dependabot_regression_gate:
    name: Dependabot Regression Gate
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The real `bun run build` pipeline (Tailwind v4 + Lightning CSS
      # minification), not just the jsdom Vitest environment — this is what
      # actually reproduces a prod-only minification regression like #370.
      - name: Production build
        run: bun run build

      # Runs the full Vitest suite, including the regression tests under
      # src/lib/build/ added for this audit (backdrop-filter minification,
      # MSIX manifest fields, release-workflow anti-race).
      - name: Run Vitest regression suite
        run: bun run test:run

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y lld libasound2-dev libssl-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-all-crates: true

      # --locked fails outright if this PR's Cargo.toml bump left Cargo.lock
      # inconsistent, instead of silently re-resolving it.
      - name: Run cargo test (locked)
        run: cargo test --workspace --lib --tests --locked
